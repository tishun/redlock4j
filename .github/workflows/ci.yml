name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Test on ubuntu-latest with Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java: [8, 11, 17, 21]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Compile project
      run: mvn formatter:format

    - name: Run unit and integration tests (requires Testcontainers)
      run: mvn verify jacoco:report
      env:
        TESTCONTAINERS_RYUK_DISABLED: false

    - name: Run all tests (including performance tests on nightly)
      if: github.event_name == 'schedule'
      run: mvn test -Dgroups=performance
      continue-on-error: true
      env:
        TESTCONTAINERS_RYUK_DISABLED: false

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        file: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
